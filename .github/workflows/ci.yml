name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed credentials
        run: |
          set -euo pipefail
          # Scan tracked files only (history is handled by the rotation runbook).
          patterns='rzp_live_[A-Za-z0-9]{10,}|sk-[A-Za-z0-9]{24,}|gsk_[A-Za-z0-9]{24,}|whsec_[A-Za-z0-9]{16,}|re_[A-Za-z0-9]{20,}|tvly-[A-Za-z0-9]{16,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -nE "$patterns" -- . ':!*.md' ':!*.example' ':!.github/*'; then
            echo "::error::A credential-like literal is committed. Remove it and rotate the key."
            exit 1
          fi
          # Tracked .env files other than the placeholder template.
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -vE '\.env\.example$'; then
            echo "::error::An environment file is tracked. Remove it from the index."
            exit 1
          fi
          echo "No credential literals found."

  quality:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests (security helpers)
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [quality, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npx next build --webpack
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e-security:
    name: Security regression suite
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run security regressions
        run: npx playwright test e2e/security-regressions.spec.ts --project=chromium --workers=1
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Tests assert that unauthenticated access is refused, so no real
          # credentials are needed. The dev server uses the explicit
          # throwaway-store escape hatch because CI has no database.
          LIKEWAY_ALLOW_MEMORY_DB: "1"
          NODE_ENV: development
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
