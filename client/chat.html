<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LikeWay AI - Chat</title>
  <link rel="stylesheet" href="chat.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="newChatBtn">
          <span class="plus-icon">+</span>
          New Chat
        </button>
      </div>
      
      <div class="sidebar-content">
        <div class="chat-history">
          <div class="history-item active">
            <span class="chat-icon">💬</span>
            <span class="chat-title">New Chat</span>
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-plan" id="userPlan">
          <span class="plan-icon">⭐</span>
          <span class="plan-name">Free Plan</span>
          <button class="upgrade-link" id="upgradeBtn">Upgrade</button>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="top-bar">
        <button class="menu-btn" id="menuBtn">
          <span class="menu-icon">☰</span>
        </button>
        <h1 class="app-title">LikeWay AI</h1>
        <div class="model-selector">
          <select id="modelSelect">
            <option value="gpt-3.5">GPT-3.5</option>
            <option value="gpt-4">GPT-4</option>
            <option value="claude">Claude</option>
          </select>
        </div>
      </header>

      <!-- Chat Area -->
      <div class="chat-area" id="chatArea">
        <!-- Welcome Message -->
        <div class="welcome-message" id="welcomeMessage">
          <div class="welcome-icon">🤖</div>
          <h2>How can I help you today?</h2>
          <p>Ask me anything - I'm here to help!</p>
          
          <div class="suggestion-chips">
            <button class="chip" data-prompt="Explain quantum computing">Explain quantum computing</button>
            <button class="chip" data-prompt="Write a Python function">Write a Python function</button>
            <button class="chip" data-prompt="Compare React vs Vue">Compare React vs Vue</button>
            <button class="chip" data-prompt="Help me debug code">Help me debug code</button>
          </div>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" id="messagesContainer"></div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea 
            id="messageInput" 
            placeholder="Message LikeWay AI..." 
            rows="1"
            autofocus
          ></textarea>
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">LikeWay AI can make mistakes. Check important info.</p>
      </div>
    </main>
  </div>

  <!-- Upgrade Modal -->
  <div class="modal-overlay" id="upgradeModal" style="display: none;">
    <div class="modal-content">
      <button class="modal-close" id="closeModal">&times;</button>
      <h2>Upgrade Your Plan</h2>
      <p>Unlock 200+ response patterns</p>
      <div class="modal-plans">
        <button class="modal-plan-btn" data-plan="go" data-amount="299">
          Go - ₹299/mo
        </button>
        <button class="modal-plan-btn" data-plan="plus" data-amount="799">
          Plus - ₹799/mo
        </button>
        <button class="modal-plan-btn" data-plan="pro" data-amount="1999">
          Pro - ₹1,999/mo
        </button>
      </div>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
