<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Payment</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <div class="payment-container">
    <!-- Header -->
    <div class="payment-header">
      <div class="logo">💳</div>
      <h1>Secure Payment</h1>
      <p>Powered by Razorpay</p>
    </div>

    <!-- Main Payment Card -->
    <div class="payment-card">
      <!-- Amount Selection -->
      <div class="section">
        <label class="section-label">Select Amount</label>
        <div class="amount-grid">
          <button class="amount-btn" data-amount="100">₹100</button>
          <button class="amount-btn" data-amount="500">₹500</button>
          <button class="amount-btn active" data-amount="1000">₹1,000</button>
          <button class="amount-btn" data-amount="2000">₹2,000</button>
          <button class="amount-btn" data-amount="5000">₹5,000</button>
          <button class="amount-btn custom" id="customBtn">Custom</button>
        </div>
        <div class="custom-amount-input" id="customInput" style="display: none;">
          <span class="rupee">₹</span>
          <input type="number" id="customAmount" placeholder="Enter amount" min="1">
        </div>
      </div>

      <!-- Customer Details -->
      <div class="section">
        <label class="section-label">Your Details</label>
        <div class="form-group">
          <input type="text" id="customerName" placeholder="Full Name" required>
        </div>
        <div class="form-group">
          <input type="email" id="customerEmail" placeholder="Email Address" required>
        </div>
        <div class="form-group">
          <input type="tel" id="customerPhone" placeholder="Phone Number" required>
        </div>
      </div>

      <!-- Pay Button -->
      <button class="pay-btn" id="payBtn">
        <span class="pay-text">Pay ₹1,000</span>
        <span class="pay-loader" style="display: none;">
          <span class="spinner"></span> Processing...
        </span>
      </button>

      <!-- Status Messages -->
      <div class="status" id="status" style="display: none;">
        <span class="status-icon"></span>
        <span class="status-text"></span>
      </div>
    </div>

    <!-- Order Summary (shown after payment) -->
    <div class="order-card" id="orderCard" style="display: none;">
      <div class="success-icon">✓</div>
      <h2>Payment Successful!</h2>
      <div class="order-details">
        <div class="detail-row">
          <span>Order ID</span>
          <span id="orderId">-</span>
        </div>
        <div class="detail-row">
          <span>Payment ID</span>
          <span id="paymentId">-</span>
        </div>
        <div class="detail-row">
          <span>Amount</span>
          <span id="paidAmount">-</span>
        </div>
        <div class="detail-row">
          <span>Status</span>
          <span class="status-badge success">PAID</span>
        </div>
      </div>
      <button class="new-payment-btn" id="newPaymentBtn">Make Another Payment</button>
    </div>

    <!-- Security Badge -->
    <div class="security-badge">
      <span class="lock">🔒</span>
      <span>256-bit SSL Encrypted | PCI DSS Compliant</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
