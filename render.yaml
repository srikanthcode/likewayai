services:
  - type: web
    name: likeway
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npx playwright install --with-deps chromium && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: likeway_ai
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_KEYS
        sync: false
      - key: GROQ_KEYS
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://likeway.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: TAVILY_API_KEY
        sync: false
    healthCheckPath: /api/health
